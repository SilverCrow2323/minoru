name: CI

on:
  push:
  pull_request:

jobs:
  lua-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Syntax-check every .lua file
        run: |
          set -e
          find . -name '*.lua' -not -path './.git/*' | while read -r f; do
            echo "checking $f"
            luac5.4 -p "$f"
          done

      - name: Install luacheck
        run: |
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Lint (luacheck)
        run: luacheck . --no-color --codes

      - name: Run test suite
        run: |
          set -e
          for f in tests/test_*.lua; do
            echo "=== $f ==="
            lua5.4 "$f"
          done
